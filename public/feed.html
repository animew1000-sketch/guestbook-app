<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Social Feed</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><a href="index.html" class="site-link">Welcome to Anime Social</a></h1>
        </div>

        <div id="auth-bar" class="auth-bar">
            <span id="user-status">Not logged in</span>
            <button id="auth-btn" class="btn-small" onclick="handleAuthButtonClick()">Login / Register</button>
        </div>

        <!-- Login Notice Banner for Guests -->
        <div id="login-notice" class="login-notice-box">
            <p>Please log in or create an account to share posts in the feed.</p>
            <a href="auth.html" class="login-notice-btn" style="display: inline-block; text-decoration: none;">Login / Register</a>
        </div>

        <!-- Create Post Section -->
        <form id="post-form" class="hidden" onsubmit="handlePostSubmit(event)">
            <input type="text" id="post-author" placeholder="Your Name or Display Name" readonly required>
            <textarea id="post-content" rows="3" placeholder="Write a public update..." required></textarea>
            <input type="file" id="post-image" accept="image/*">
            <button type="submit" id="submit-btn">Submit Post</button>
        </form>

        <!-- Feed Tabs -->
        <div class="tab-buttons">
            <button class="tab-btn active" id="tab-public" onclick="switchFeedTab('public')">Public Feed</button>
            <button class="tab-btn" id="tab-following" onclick="switchFeedTab('following')">Following Feed</button>
        </div>

        <!-- Feed List -->
        <div id="messages" class="messages"></div>
    </div>

    <!-- Embedded Script -->
    <script>
        let currentUser = null;
        let currentFeedTab = 'public';

        document.addEventListener('DOMContentLoaded', async () => {
            // Read URL query params (e.g. feed.html?tab=following)
            const urlParams = new URLSearchParams(window.location.search);
            const tabParam = urlParams.get('tab');
            if (tabParam === 'following' || tabParam === 'public') {
                currentFeedTab = tabParam;
            }

            // Sync tab button UI
            const publicBtn = document.getElementById('tab-public');
            const followingBtn = document.getElementById('tab-following');
            if (publicBtn) publicBtn.classList.toggle('active', currentFeedTab === 'public');
            if (followingBtn) followingBtn.classList.toggle('active', currentFeedTab === 'following');

            await checkUserSession();
            loadMessages();
        });

        function updateUIState() {
            const authBtn = document.getElementById('auth-btn');
            const userStatus = document.getElementById('user-status');
            const postForm = document.getElementById('post-form');
            const loginNotice = document.getElementById('login-notice');

            if (currentUser) {
                if (userStatus) userStatus.innerText = `Logged in as @${currentUser.username}`;
                if (authBtn) authBtn.innerText = 'Logout';
                if (postForm) postForm.classList.remove('hidden');
                if (loginNotice) loginNotice.classList.add('hidden');
                
                const authorInput = document.getElementById('post-author');
                if (authorInput) authorInput.value = currentUser.username;
            } else {
                if (userStatus) userStatus.innerText = 'Not logged in';
                if (authBtn) authBtn.innerText = 'Login / Register';
                if (postForm) postForm.classList.add('hidden');
                if (loginNotice) loginNotice.classList.remove('hidden');
            }
        }

        function handleAuthButtonClick() {
            if (currentUser) {
                handleLogout();
            } else {
                window.location.href = 'auth.html';
            }
        }

        function switchFeedTab(tab) {
            currentFeedTab = tab;
            const publicBtn = document.getElementById('tab-public');
            const followingBtn = document.getElementById('tab-following');

            if (publicBtn) publicBtn.classList.toggle('active', tab === 'public');
            if (followingBtn) followingBtn.classList.toggle('active', tab === 'following');
            
            loadMessages();
        }

        async function loadMessages() {
            const messagesContainer = document.getElementById('messages');
            if (!messagesContainer) return;

            try {
                const response = await fetch(`/api/messages?feed=${currentFeedTab}`, { credentials: 'include' });
                const messages = await response.json();

                messagesContainer.innerHTML = '';

                if (!Array.isArray(messages) || messages.length === 0) {
                    messagesContainer.innerHTML = `<p class="empty-msg">No posts in ${currentFeedTab} feed yet.</p>`;
                    return;
                }

                messages.forEach(msg => {
                    const card = document.createElement('div');
                    card.className = 'msg-card';

                    let imageHtml = '';
                    if (msg.image_url) {
                        imageHtml = `<img src="${msg.image_url}" class="msg-img" alt="Uploaded Content">`;
                    }

                    let deleteBtnHtml = '';
                    if (currentUser && Number(currentUser.id) === Number(msg.user_id)) {
                        deleteBtnHtml = `<button onclick="deletePost(${msg.id})" class="btn-delete">Delete</button>`;
                    }

                    const dateStr = msg.created_at ? new Date(msg.created_at).toLocaleString() : '';

                    card.innerHTML = `
                        <div class="msg-header">
                            <span class="msg-author">${escapeHtml(msg.name || 'Anonymous')}</span>
                            <div class="msg-meta">
                                <span class="msg-date">${dateStr}</span>
                                ${deleteBtnHtml}
                            </div>
                        </div>
                        <div class="msg-text">${escapeHtml(msg.message || '')}</div>
                        ${imageHtml}
                    `;

                    messagesContainer.appendChild(card);
                });
            } catch (err) {
                console.error('Error loading messages:', err);
                messagesContainer.innerHTML = `<p class="error-msg">Failed to load posts from database.</p>`;
            }
        }

        async function deletePost(postId) {
            if (!confirm('Are you sure you want to delete this post?')) return;

            try {
                const res = await fetch(`/api/messages/${postId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                const data = await res.json();

                if (res.ok) {
                    loadMessages();
                } else {
                    alert(data.error || 'Failed to delete post.');
                }
            } catch (err) {
                console.error('Delete error:', err);
            }
        }

        async function handlePostSubmit(event) {
            event.preventDefault();

            if (!currentUser) {
                window.location.href = 'auth.html';
                return;
            }

            const contentInput = document.getElementById('post-content').value;
            const imageFileInput = document.getElementById('post-image').files[0];
            const submitBtn = document.getElementById('submit-btn');

            submitBtn.disabled = true;
            submitBtn.innerText = 'Posting...';

            let base64Image = null;
            if (imageFileInput) {
                base64Image = await convertFileToBase64(imageFileInput);
            }

            const payload = {
                message: contentInput,
                image_url: base64Image
            };

            try {
                const response = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    document.getElementById('post-content').value = '';
                    document.getElementById('post-image').value = '';
                    loadMessages();
                } else {
                    const data = await response.json();
                    alert(data.error || 'Failed to submit post.');
                }
            } catch (err) {
                console.error('Submit error:', err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Submit Post';
            }
        }

        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function handleLogout() {
            try {
                await fetch('/api/logout', { method: 'POST', credentials: 'include' });
                currentUser = null;
                updateUIState();
                loadMessages();
            } catch (err) {
                console.error('Logout error:', err);
            }
        }

        async function checkUserSession() {
            try {
                const res = await fetch('/api/me', { credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    currentUser = data.user;
                } else {
                    currentUser = null;
                }
            } catch (e) {
                currentUser = null;
            }
            updateUIState();
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
