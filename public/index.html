<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Social Feed</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome to Anime Social</h1>
        </div>

        <div id="auth-bar" class="auth-bar">
            <span id="user-status">Not logged in</span>
            <button id="auth-btn" class="btn-small" onclick="toggleAuthModal()">Login / Register</button>
        </div>

        <!-- Auth Section -->
        <div id="auth-section" class="hidden">
            <div class="tab-buttons">
                <button class="tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Login</button>
                <button class="tab-btn" id="tab-register" onclick="switchAuthTab('register')">Create Profile</button>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <input type="email" id="login-email" placeholder="Email Address" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
                <input type="text" id="reg-username" placeholder="Choose a Username" required>
                <input type="email" id="reg-email" placeholder="Email Address" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <button type="submit">Register</button>
            </form>
        </div>

        <!-- Create Post Section -->
        <form id="post-form" onsubmit="handlePostSubmit(event)">
            <input type="text" id="post-author" placeholder="Your Name or Display Name" required>
            <textarea id="post-content" rows="3" placeholder="Write a public update..." required></textarea>
            <input type="file" id="post-image" accept="image/*">
            <button type="submit" id="submit-btn">Submit Post</button>
        </form>

        <!-- Feed Tabs -->
        <div class="tab-buttons">
            <button class="tab-btn active" id="tab-public" onclick="switchFeedTab('public')">Public Feed</button>
            <button class="tab-btn" id="tab-following" onclick="switchFeedTab('following')">Following Feed</button>
        </div>

        <!-- Feed List -->
        <div id="messages" class="messages"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
