<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook & Social Feed</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3CSVG xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23818cf8'/%3E%3Cstop offset='100%25' stop-color='%234f46e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='%230f172a'/%3E%3Cpath d='M50 20 L80 35 L50 50 L20 35 Z' fill='url(%23g)'/%3E%3Cpath d='M20 48 L50 63 L80 48' stroke='url(%23g)' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M20 63 L50 78 L80 63' stroke='url(%23g)' stroke-width='8' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.85);
            --primary: #6366f1;
            --text: #f8fafc;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            
            /* PNG Background from public/images folder with dark fallback */
            background-color: var(--bg-color);
            background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .header h1 { font-size: 1.4rem; margin: 0; }
        
        .auth-bar { background: rgba(15, 23, 42, 0.6); padding: 10px 14px; border-radius: 8px; margin-bottom: 20px; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }

        .tab-buttons { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab-btn { flex: 1; padding: 8px; background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255,255,255,0.1); color: var(--text); border-radius: 6px; cursor: pointer; text-align: center; font-size: 0.85rem; }
        .tab-btn.active { background: var(--primary); font-weight: bold; border-color: var(--primary); }

        form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        input, textarea, button { border-radius: 8px; padding: 12px; font-size: 0.95rem; outline: none; }
        input[type="text"], input[type="email"], input[type="password"], textarea { background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.2); color: var(--text); }
        input[type="file"] { color: var(--text); font-size: 0.85rem; }
        
        button { background: var(--primary); color: white; border: none; font-weight: 600; cursor: pointer; }
        button:hover { background: #4f46e5; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-small { padding: 4px 10px; font-size: 0.8rem; border-radius: 4px; }

        .messages { display: flex; flex-direction: column; gap: 12px; max-height: 320px; overflow-y: auto; }
        .msg-card { background: rgba(15, 23, 42, 0.5); border-left: 3px solid var(--primary); padding: 12px; border-radius: 6px; position: relative; }
        .msg-header { display: flex; justify-content: space-between; align-items: center; }
        .msg-author { font-weight: bold; font-size: 0.9rem; color: var(--primary); }
        .msg-text { margin-top: 6px; font-size: 0.95rem; }
        .msg-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 6px; margin-top: 8px; display: block; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Guestbook & Social</h1>
        </div>

        <!-- Account Status / Login Section -->
        <div id="authStatus" class="auth-bar">
            <span id="userGreeting">Not logged in</span>
            <button id="authToggleBtn" class="btn-small">Login / Register</button>
        </div>

        <!-- Auth Form -->
        <div id="authFormContainer" class="hidden">
            <div class="tab-buttons">
                <div id="tabLogin" class="tab-btn active" onclick="switchAuthTab('login')">Login</div>
                <div id="tabRegister" class="tab-btn" onclick="switchAuthTab('register')">Create Profile</div>
            </div>

            <form id="authForm">
                <input type="email" id="authEmail" placeholder="Email Address" required>
                <input type="password" id="authPassword" placeholder="Password" required>
                <input type="text" id="authUsername" class="hidden" placeholder="Choose a Username">
                <button type="submit" id="authSubmitBtn">Login</button>
            </form>
        </div>

        <!-- Post Form -->
        <form id="dataForm" enctype="multipart/form-data">
            <input type="text" id="name" name="name" placeholder="Your Name or Display Name" required>
            <textarea id="message" name="message" placeholder="Write a public update..." rows="2" required></textarea>
            <input type="file" id="image" name="image" accept="image/*">
            <button type="submit" id="submitBtn">Submit Post</button>
        </form>

        <!-- Feed Tabs -->
        <div class="tab-buttons">
            <div id="tabPublic" class="tab-btn active" onclick="switchFeedTab('public')">Public Feed</div>
            <div id="tabFollowing" class="tab-btn" onclick="switchFeedTab('following')">Following Feed</div>
        </div>

        <!-- Message List -->
        <div class="messages" id="messagesList"></div>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('user')) || null;
        let authToken = localStorage.getItem('token') || null;
        let activeAuthMode = 'login';
        let currentFeed = 'public';

        const userGreeting = document.getElementById('userGreeting');
        const authToggleBtn = document.getElementById('authToggleBtn');
        const authFormContainer = document.getElementById('authFormContainer');
        const authForm = document.getElementById('authForm');
        const authUsername = document.getElementById('authUsername');
        const authSubmitBtn = document.getElementById('authSubmitBtn');

        const dataForm = document.getElementById('dataForm');
        const submitBtn = document.getElementById('submitBtn');
        const messagesList = document.getElementById('messagesList');

        function updateAuthUI() {
            if (currentUser) {
                userGreeting.innerText = `Logged in as @${currentUser.username}`;
                authToggleBtn.innerText = 'Logout';
                document.getElementById('name').value = currentUser.username;
            } else {
                userGreeting.innerText = 'Not logged in';
                authToggleBtn.innerText = 'Login / Register';
            }
        }

        authToggleBtn.addEventListener('click', () => {
            if (currentUser) {
                localStorage.removeItem('user');
                localStorage.removeItem('token');
                currentUser = null;
                authToken = null;
                updateAuthUI();
                fetchMessages();
            } else {
                authFormContainer.classList.toggle('hidden');
            }
        });

        function switchAuthTab(mode) {
            activeAuthMode = mode;
            document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
            document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
            authUsername.classList.toggle('hidden', mode === 'login');
            authUsername.required = mode === 'register';
            authSubmitBtn.innerText = mode === 'login' ? 'Login' : 'Create Profile';
        }

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const username = authUsername.value;

            const endpoint = activeAuthMode === 'login' ? '/api/auth/login' : '/api/auth/register';
            const body = activeAuthMode === 'login' ? { email, password } : { email, password, username };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Authentication failed');

                if (activeAuthMode === 'register') {
                    alert('Profile created! You can now log in.');
                    switchAuthTab('login');
                } else {
                    currentUser = data.user;
                    authToken = data.token;
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    localStorage.setItem('token', authToken);
                    updateAuthUI();
                    authFormContainer.classList.add('hidden');
                    fetchMessages();
                }
            } catch (err) {
                alert(err.message);
            }
        });

        function switchFeedTab(feedType) {
            currentFeed = feedType;
            document.getElementById('tabPublic').classList.toggle('active', feedType === 'public');
            document.getElementById('tabFollowing').classList.toggle('active', feedType === 'following');
            fetchMessages();
        }

        function escapeHtml(text) {
            if (!text) return '';
            return String(text).replace(/[&<>"']/g, "");
        }

        async function followUser(userId) {
            if (!authToken) return alert('Please log in to follow users');
            try {
                const res = await fetch(`/api/users/${userId}/follow`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error);
                alert('Followed user successfully!');
            } catch (err) {
                alert(err.message);
            }
        }

        async function deletePost(messageId) {
            if (!confirm('Are you sure you want to delete this post?')) return;

            const currentName = document.getElementById('name').value;
            const bodyData = {
                userId: currentUser ? currentUser.id : null,
                name: currentName
            };

            try {
                const res = await fetch(`/api/messages/${messageId}`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bodyData)
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Failed to delete post');

                fetchMessages();
            } catch (err) {
                alert(err.message);
            }
        }

        async function fetchMessages() {
            const endpoint = currentFeed === 'following' ? '/api/feed' : '/api/messages';
            const headers = authToken ? { 'Authorization': `Bearer ${authToken}` } : {};

            try {
                const res = await fetch(endpoint, { headers });
                if (!res.ok) throw new Error('Failed to fetch posts');
                const data = await res.json();

                messagesList.innerHTML = data.map(m => {
                    const isOwner = (currentUser && m.user_id === currentUser.id) || 
                                    (document.getElementById('name').value && m.name === document.getElementById('name').value);

                    return `
                        <div class="msg-card">
                            <div class="msg-header">
                                <div class="msg-author">${escapeHtml(m.username ? '@' + m.username : m.name)}</div>
                                <div>
                                    ${m.user_id && currentUser && m.user_id !== currentUser.id ? 
                                        `<button class="btn-small" onclick="followUser(${m.user_id})">Follow</button>` : ''}
                                    ${isOwner ? `<button class="btn-small" style="background:#ef4444;" onclick="deletePost(${m.id})">Delete</button>` : ''}
                                </div>
                            </div>
                            <div class="msg-text">${escapeHtml(m.message)}</div>
                            ${m.image_url ? `<img class="msg-img" src="${m.image_url}" alt="Uploaded post image" />` : ''}
                        </div>
                    `;
                }).join('');
            } catch (err) {
                messagesList.innerHTML = `<p style="font-size:0.85rem; color:#f87171;">${err.message}</p>`;
            }
        }

        dataForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerText = 'Uploading...';

            try {
                const formData = new FormData(dataForm);
                if (currentUser) formData.append('userId', currentUser.id);

                const res = await fetch('/api/messages', { method: 'POST', body: formData });
                if (!res.ok) throw new Error('Upload failed');

                dataForm.reset();
                if (currentUser) document.getElementById('name').value = currentUser.username;
                await fetchMessages();
            } catch (err) {
                alert('Error submitting post.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Submit Post';
            }
        });

        updateAuthUI();
        fetchMessages();
    </script>
</body>
</html>
