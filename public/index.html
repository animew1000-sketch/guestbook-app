<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Social Feed</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Interactive Hero Banner SVG -->
        <div class="banner-container">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" class="hero-banner">
              <defs>
                <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#0f172a"/>
                  <stop offset="50%" stop-color="#1e1b4b"/>
                  <stop offset="100%" stop-color="#311042"/>
                </linearGradient>
                <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#818cf8"/>
                  <stop offset="50%" stop-color="#c084fc"/>
                  <stop offset="100%" stop-color="#f43f5e"/>
                </linearGradient>
                <radialGradient id="sphere-grad" cx="40%" cy="40%" r="60%">
                  <stop offset="0%" stop-color="#a855f7"/>
                  <stop offset="50%" stop-color="#6366f1"/>
                  <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
                </radialGradient>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="15" result="blur" />
                  <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
                  <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
                </filter>
              </defs>

              <rect width="1200" height="630" fill="url(#bg-gradient)"/>

              <g stroke="#334155" stroke-width="1" opacity="0.3">
                <path d="M0 100 L1200 100 M0 200 L1200 200 M0 300 L1200 300 M0 400 L1200 400 M0 500 L1200 500" />
                <path d="M200 0 L200 630 M400 0 L400 630 M600 0 L600 630 M800 0 L800 630 M1000 0 L1000 630" />
              </g>

              <circle cx="950" cy="315" r="220" fill="url(#sphere-grad)" filter="url(#glow)" opacity="0.7"/>
              <circle cx="950" cy="315" r="180" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="15 10" opacity="0.8"/>
              <circle cx="950" cy="315" r="240" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.5"/>

              <path d="M-100 550 L1300 150" stroke="url(#neon-glow)" stroke-width="6" filter="url(#glow)" opacity="0.8"/>
              <path d="M-100 580 L1300 180" stroke="#f43f5e" stroke-width="2" opacity="0.5"/>

              <g transform="translate(870, 235)" filter="url(#soft-shadow)">
                <path d="M 80 0 C 135 0, 160 35, 160 80 C 160 125, 125 150, 80 150 C 60 150, 30 165, 10 180 C 20 155, 0 130, 0 80 C 0 35, 25 0, 80 0 Z" 
                      fill="#1e1b4b" stroke="url(#neon-glow)" stroke-width="5" filter="url(#glow)"/>
                <path d="M 80 40 L 85 65 L 110 70 L 85 75 L 80 100 L 75 75 L 50 70 L 75 65 Z" fill="#ffffff"/>
                <path d="M 120 30 L 122 42 L 134 44 L 122 46 L 120 58 L 118 46 L 106 44 L 118 42 Z" fill="#c084fc"/>
              </g>

              <g filter="url(#soft-shadow)">
                <rect x="120" y="180" width="180" height="34" rx="17" fill="#6366f1" opacity="0.2"/>
                <rect x="120" y="180" width="180" height="34" rx="17" fill="none" stroke="#818cf8" stroke-width="1.5"/>
                <text x="210" y="202" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="2">COMMUNITY FEED</text>

                <text x="120" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff">ANIME SOCIAL</text>
                
                <rect x="120" y="305" width="420" height="6" rx="3" fill="url(#neon-glow)" filter="url(#glow)"/>

                <text x="120" y="360" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
                  Connect, share updates, and post your favorite art.
                </text>

                <!-- Interactive SVG Buttons -->
                <g transform="translate(120, 410)">
                  <!-- Public Feed Button -->
                  <g onclick="switchFeedTab('public')" style="cursor: pointer;">
                    <rect x="0" y="0" width="140" height="40" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
                    <text x="70" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#38bdf8" font-weight="600" text-anchor="middle"># Public Feed</text>
                  </g>
                  
                  <!-- Following Feed Button -->
                  <g onclick="switchFeedTab('following')" style="cursor: pointer;">
                    <rect x="155" y="0" width="150" height="40" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
                    <text x="230" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#f43f5e" font-weight="600" text-anchor="middle"># Following Feed</text>
                  </g>

                  <!-- Community Button (Lists Users) -->
                  <g onclick="showCommunityUsers()" style="cursor: pointer;">
                    <rect x="320" y="0" width="140" height="40" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
                    <text x="390" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#a855f7" font-weight="600" text-anchor="middle"># Community</text>
                  </g>
                </g>
              </g>
            </svg>
        </div>

        <div class="header">
            <h1><a href="https://animepictures.store" class="site-link">Welcome to Anime Social</a></h1>
        </div>

        <div id="auth-bar" class="auth-bar">
            <span id="user-status">Not logged in</span>
            <button id="auth-btn" class="btn-small" onclick="handleAuthButtonClick()">Login / Register</button>
        </div>

        <!-- Auth Section -->
        <div id="auth-section" class="hidden">
            <div class="tab-buttons">
                <button class="tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Login</button>
                <button class="tab-btn" id="tab-register" onclick="switchAuthTab('register')">Create Profile</button>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <input type="email" id="login-email" placeholder="Email Address" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
                <input type="text" id="reg-username" placeholder="Choose a Username" required>
                <input type="email" id="reg-email" placeholder="Email Address" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <button type="submit">Register</button>
            </form>
        </div>

        <!-- Community Users List Section -->
        <div id="community-section" class="hidden login-notice-box">
            <h3 style="color: #a855f7; margin-bottom: 12px;">Posted Members</h3>
            <div id="community-users-list" style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px;"></div>
            <button onclick="hideCommunityUsers()" class="btn-small" style="background: #475569;">Close</button>
        </div>

        <!-- Login Prompt Notice -->
        <div id="login-notice" class="login-notice-box">
            <p>Please log in or create an account to share posts in the feed.</p>
            <button onclick="toggleAuthModal()" class="login-notice-btn">Login / Register</button>
        </div>

        <!-- Create Post Section -->
        <form id="post-form" class="hidden" onsubmit="handlePostSubmit(event)">
            <input type="text" id="post-author" placeholder="Your Name or Display Name" readonly required>
            <textarea id="post-content" rows="3" placeholder="Write a public update..." required></textarea>
            <input type="file" id="post-image" accept="image/*">
            <button type="submit" id="submit-btn">Submit Post</button>
        </form>

        <!-- Feed Tabs -->
        <div class="tab-buttons">
            <button class="tab-btn active" id="tab-public" onclick="switchFeedTab('public')">Public Feed</button>
            <button class="tab-btn" id="tab-following" onclick="switchFeedTab('following')">Following Feed</button>
        </div>

        <!-- Feed List -->
        <div id="messages" class="messages"></div>
    </div>

    <!-- Embedded Frontend Logic -->
    <script>
        let currentUser = null;
        let currentFeedTab = 'public';
        let allMessages = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await checkUserSession();
            loadMessages();
        });

        function updateUIState() {
            const authBtn = document.getElementById('auth-btn');
            const userStatus = document.getElementById('user-status');
            const postForm = document.getElementById('post-form');
            const loginNotice = document.getElementById('login-notice');

            if (currentUser) {
                if (userStatus) userStatus.innerText = `Logged in as @${currentUser.username}`;
                if (authBtn) authBtn.innerText = 'Logout';
                if (postForm) postForm.classList.remove('hidden');
                if (loginNotice) loginNotice.classList.add('hidden');
                
                const authorInput = document.getElementById('post-author');
                if (authorInput) authorInput.value = currentUser.username;
            } else {
                if (userStatus) userStatus.innerText = 'Not logged in';
                if (authBtn) authBtn.innerText = 'Login / Register';
                if (postForm) postForm.classList.add('hidden');
                if (loginNotice) loginNotice.classList.remove('hidden');
            }
        }

        function handleAuthButtonClick() {
            if (currentUser) {
                handleLogout();
            } else {
                toggleAuthModal();
            }
        }

        function switchFeedTab(tab) {
            currentFeedTab = tab;
            const publicBtn = document.getElementById('tab-public');
            const followingBtn = document.getElementById('tab-following');

            if (publicBtn) publicBtn.classList.toggle('active', tab === 'public');
            if (followingBtn) followingBtn.classList.toggle('active', tab === 'following');
            
            loadMessages();
        }

        async function loadMessages() {
            const messagesContainer = document.getElementById('messages');
            if (!messagesContainer) return;

            try {
                const response = await fetch(`/api/messages?feed=${currentFeedTab}`, { credentials: 'include' });
                const messages = await response.json();
                allMessages = Array.isArray(messages) ? messages : [];

                messagesContainer.innerHTML = '';

                if (allMessages.length === 0) {
                    messagesContainer.innerHTML = `<p class="empty-msg">No posts in ${currentFeedTab} feed yet.</p>`;
                    return;
                }

                allMessages.forEach(msg => {
                    const card = document.createElement('div');
                    card.className = 'msg-card';

                    let imageHtml = '';
                    if (msg.image_url) {
                        imageHtml = `<img src="${msg.image_url}" class="msg-img" alt="Uploaded Content">`;
                    }

                    let deleteBtnHtml = '';
                    if (currentUser && Number(currentUser.id) === Number(msg.user_id)) {
                        deleteBtnHtml = `<button onclick="deletePost(${msg.id})" class="btn-delete">Delete</button>`;
                    }

                    const dateStr = msg.created_at ? new Date(msg.created_at).toLocaleString() : '';

                    card.innerHTML = `
                        <div class="msg-header">
                            <span class="msg-author">${escapeHtml(msg.name || 'Anonymous')}</span>
                            <div class="msg-meta">
                                <span class="msg-date">${dateStr}</span>
                                ${deleteBtnHtml}
                            </div>
                        </div>
                        <div class="msg-text">${escapeHtml(msg.message || '')}</div>
                        ${imageHtml}
                    `;

                    messagesContainer.appendChild(card);
                });
            } catch (err) {
                console.error('Error loading messages:', err);
                messagesContainer.innerHTML = `<p class="error-msg">Failed to load posts from database.</p>`;
            }
        }

        function showCommunityUsers() {
            const communitySection = document.getElementById('community-section');
            const listContainer = document.getElementById('community-users-list');
            if (!communitySection || !listContainer) return;

            // Extract unique poster names
            const usersSet = new Set();
            allMessages.forEach(msg => {
                if (msg.name) usersSet.add(msg.name);
            });

            const uniqueUsers = Array.from(usersSet);

            listContainer.innerHTML = '';
            if (uniqueUsers.length === 0) {
                listContainer.innerHTML = `<span style="color: #94a3b8;">No active posters found yet.</span>`;
            } else {
                uniqueUsers.forEach(user => {
                    const tag = document.createElement('span');
                    tag.style.cssText = 'background: #1e293b; border: 1px solid #a855f7; color: #f8fafc; padding: 4px 10px; border-radius: 16px; font-size: 0.85rem; font-weight: 600;';
                    tag.innerText = `@${user}`;
                    listContainer.appendChild(tag);
                });
            }

            communitySection.classList.remove('hidden');
        }

        function hideCommunityUsers() {
            const communitySection = document.getElementById('community-section');
            if (communitySection) communitySection.classList.add('hidden');
        }

        async function deletePost(postId) {
            if (!confirm('Are you sure you want to delete this post?')) return;

            try {
                const res = await fetch(`/api/messages/${postId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                const data = await res.json();

                if (res.ok) {
                    loadMessages();
                } else {
                    alert(data.error || 'Failed to delete post.');
                }
            } catch (err) {
                console.error('Delete error:', err);
            }
        }

        async function handlePostSubmit(event) {
            event.preventDefault();

            if (!currentUser) {
                alert('You must log in to submit a post.');
                toggleAuthModal();
                return;
            }

            const contentInput = document.getElementById('post-content').value;
            const imageFileInput = document.getElementById('post-image').files[0];
            const submitBtn = document.getElementById('submit-btn');

            submitBtn.disabled = true;
            submitBtn.innerText = 'Posting...';

            let base64Image = null;
            if (imageFileInput) {
                base64Image = await convertFileToBase64(imageFileInput);
            }

            const payload = {
                message: contentInput,
                image_url: base64Image
            };

            try {
                const response = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    document.getElementById('post-content').value = '';
                    document.getElementById('post-image').value = '';
                    loadMessages();
                } else {
                    const data = await response.json();
                    alert(data.error || 'Failed to submit post.');
                }
            } catch (err) {
                console.error('Submit error:', err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Submit Post';
            }
        }

        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function toggleAuthModal() {
            const authSection = document.getElementById('auth-section');
            if (authSection) authSection.classList.toggle('hidden');
        }

        function switchAuthTab(tab) {
            const loginTab = document.getElementById('tab-login');
            const regTab = document.getElementById('tab-register');
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');

            if (loginTab) loginTab.classList.toggle('active', tab === 'login');
            if (regTab) regTab.classList.toggle('active', tab === 'register');
            
            if (loginForm) loginForm.classList.toggle('hidden', tab !== 'login');
            if (regForm) regForm.classList.toggle('hidden', tab !== 'register');
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    currentUser = data.user;
                    updateUIState();
                    toggleAuthModal();
                    loadMessages();
                } else {
                    alert(data.error || 'Login failed');
                }
            } catch (err) {
                console.error('Login error:', err);
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    alert('Registration successful! Please log in.');
                    switchAuthTab('login');
                } else {
                    alert(data.error || 'Registration failed');
                }
            } catch (err) {
                console.error('Register error:', err);
            }
        }

        async function handleLogout() {
            try {
                await fetch('/api/logout', { method: 'POST', credentials: 'include' });
                currentUser = null;
                updateUIState();
                loadMessages();
            } catch (err) {
                console.error('Logout error:', err);
            }
        }

        async function checkUserSession() {
            try {
                const res = await fetch('/api/me', { credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    currentUser = data.user;
                } else {
                    currentUser = null;
                }
            } catch (e) {
                currentUser = null;
            }
            updateUIState();
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
