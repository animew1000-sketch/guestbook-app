<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Dark Cyberpunk Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Sphere Gradient -->
    <radialGradient id="sphere-grad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </radialGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Cyber Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <path d="M0 100 L1200 100 M0 200 L1200 200 M0 300 L1200 300 M0 400 L1200 400 M0 500 L1200 500" />
    <path d="M200 0 L200 630 M400 0 L400 630 M600 0 L600 630 M800 0 L800 630 M1000 0 L1000 630" />
  </g>

  <!-- Glowing Abstract Circles & Shapes -->
  <circle cx="950" cy="315" r="220" fill="url(#sphere-grad)" filter="url(#glow)" opacity="0.7"/>
  <circle cx="950" cy="315" r="180" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="15 10" opacity="0.8"/>
  <circle cx="950" cy="315" r="240" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.5"/>

  <!-- Neon Accent Light Beam -->
  <path d="M-100 550 L1300 150" stroke="url(#neon-glow)" stroke-width="6" filter="url(#glow)" opacity="0.8"/>
  <path d="M-100 580 L1300 180" stroke="#f43f5e" stroke-width="2" opacity="0.5"/>

  <!-- Stylized Anime Social Emblem / Logo Art -->
  <g transform="translate(870, 235)" filter="url(#soft-shadow)">
    <!-- Chat / Portal Bubble Emblem -->
    <path d="M 80 0 C 135 0, 160 35, 160 80 C 160 125, 125 150, 80 150 C 60 150, 30 165, 10 180 C 20 155, 0 130, 0 80 C 0 35, 25 0, 80 0 Z" 
          fill="#1e1b4b" stroke="url(#neon-glow)" stroke-width="5" filter="url(#glow)"/>
    <!-- Sparkle Stars -->
    <path d="M 80 40 L 85 65 L 110 70 L 85 75 L 80 100 L 75 75 L 50 70 L 75 65 Z" fill="#ffffff"/>
    <path d="M 120 30 L 122 42 L 134 44 L 122 46 L 120 58 L 118 46 L 106 44 L 118 42 Z" fill="#c084fc"/>
  </g>

  <!-- Banner Typography -->
  <g filter="url(#soft-shadow)">
    <!-- Subtitle / Badge -->
    <rect x="120" y="180" width="180" height="34" rx="17" fill="#6366f1" opacity="0.2"/>
    <rect x="120" y="180" width="180" height="34" rx="17" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    <text x="210" y="202" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="2">COMMUNITY FEED</text>

    <!-- Main Title -->
    <text x="120" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff">ANIME SOCIAL</text>
    
    <!-- Neon Underline -->
    <rect x="120" y="305" width="420" height="6" rx="3" fill="url(#neon-glow)" filter="url(#glow)"/>

    <!-- Description Text -->
    <text x="120" y="360" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
      Connect, share updates, and post your favorite art.
    </text>

    <!-- Feature Badges -->
    <g transform="translate(120, 410)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="130" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#38bdf8" font-weight="600" text-anchor="middle"># Live Feed</text>
      
      <!-- Badge 2 -->
      <rect x="145" y="0" width="130" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="210" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#f43f5e" font-weight="600" text-anchor="middle"># Art Sharing</text>

      <!-- Badge 3 -->
      <rect x="290" y="0" width="130" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="355" y="23" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#a855f7" font-weight="600" text-anchor="middle"># Community</text>
    </g>
  </g>
</svg>
