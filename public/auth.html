<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Social - Authentication</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body class="landing-body">
    <!-- Top Nav Back to Home -->
    <div class="top-nav">
        <a href="index.html" class="nav-btn">← Back to Banner</a>
    </div>

    <div class="container" style="margin-top: 60px;">
        <div class="header">
            <h1><a href="index.html" class="site-link">Anime Social Portal</a></h1>
        </div>

        <div id="auth-status" class="auth-bar" style="justify-content: center; margin-bottom: 20px;">
            <span id="user-status">Checking account status...</span>
        </div>

        <!-- Auth Tabs & Forms -->
        <div class="tab-buttons">
            <button class="tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Login</button>
            <button class="tab-btn" id="tab-register" onclick="switchAuthTab('register')">Create Profile</button>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <input type="email" id="login-email" placeholder="Email Address" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button type="submit">Login to Account</button>
        </form>

        <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
            <input type="text" id="reg-username" placeholder="Choose a Username" required>
            <input type="email" id="reg-email" placeholder="Email Address" required>
            <input type="password" id="reg-password" placeholder="Password" required>
            <button type="submit">Register New Profile</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', checkExistingSession);

        function switchAuthTab(tab) {
            const loginTab = document.getElementById('tab-login');
            const regTab = document.getElementById('tab-register');
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');

            if (loginTab) loginTab.classList.toggle('active', tab === 'login');
            if (regTab) regTab.classList.toggle('active', tab === 'register');
            
            if (loginForm) loginForm.classList.toggle('hidden', tab !== 'login');
            if (regForm) regForm.classList.toggle('hidden', tab !== 'register');
        }

        async function checkExistingSession() {
            try {
                const res = await fetch('/api/me', { credentials: 'include' });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('user-status').innerText = `Already logged in as @${data.user.username}. Redirecting...`;
                    setTimeout(() => {
                        window.location.href = 'feed.html';
                    }, 1200);
                } else {
                    document.getElementById('user-status').innerText = 'Welcome! Please log in or create an account.';
                }
            } catch (err) {
                document.getElementById('user-status').innerText = 'Welcome! Please log in or create an account.';
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    window.location.href = 'feed.html';
                } else {
                    alert(data.error || 'Login failed');
                }
            } catch (err) {
                console.error('Login error:', err);
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    alert('Registration successful! Please log in.');
                    switchAuthTab('login');
                } else {
                    alert(data.error || 'Registration failed');
                }
            } catch (err) {
                console.error('Register error:', err);
            }
        }
    </script>
</body>
</html>
